name: HireALocals Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/production-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build with Webpack
        run: npm run build -- --webpack
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.hirealocals.com

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next
          test -d .next/static
          test -d public
          echo "Standalone production build verified successfully."

      - name: Package production artifact
        run: |
          mkdir -p ../release
          cp -a .next/standalone ../release/standalone
          cp -a .next/static ../release/static
          cp -a public ../release/public
          tar -czf ../hirealocals-production.tar.gz -C ../release .

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirealocals-production
          path: frontend/hirealocals-production.tar.gz
          if-no-files-found: error